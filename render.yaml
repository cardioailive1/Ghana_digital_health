# ============================================================
# render.yaml — Cardio AI Ghana on Render.com
# Web service + PostgreSQL managed database
# ============================================================

databases:
  - name: cardio-ai-postgres
    plan: free               # Render free PostgreSQL (current supported plan)
    databaseName: cardioai_ghana
    user: cardioai

services:
  - type: web
    name: cardio-ai-ghana
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: cardio-ai-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    healthCheckPath: /api/health

  # ── Background worker: ADX (FHIR→DHIS2) sync + IoMT SLA escalation ──
  # DATABASE_URL is pulled from the SAME managed Postgres as the web service,
  # so the worker can never drift onto a stale database host. The interop
  # features (DHIS2, SMS) stay dormant until their vars are set — the worker
  # simply logs "skipped" and keeps running.
  - type: worker
    name: cardio-ai-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: node server/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cardio-ai-postgres
          property: connectionString
      - key: DHIS2_BASE_URL
        sync: false
      - key: DHIS2_USER
        sync: false
      - key: DHIS2_PASS
        sync: false
      - key: DHIS2_TOKEN
        sync: false
      - key: IDSR_MAPPING_FILE
        sync: false
      - key: EWARN_BASELINE_PERIOD
        value: LAST_52_WEEKS
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
      - key: ESCALATION_CONTACTS
        sync: false

  # ── HL7 v2 MLLP listener (raw TCP; needs TLS before real PHI) ──
  # Private service — reachable inside the Render network. External HL7
  # senders require a VPN/tunnel or co-location on the openhie-stack host.
  - type: pserv
    name: cardio-ai-hl7-mllp
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: node server/hl7-service.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HL7_MLLP_PORT
        value: 2575
      - key: DATABASE_URL
        fromDatabase:
          name: cardio-ai-postgres
          property: connectionString
      - key: HL7_TLS_KEY
        sync: false
      - key: HL7_TLS_CERT
        sync: false
