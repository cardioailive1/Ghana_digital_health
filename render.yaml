# ============================================================
# render.yaml — Cardio AI Ghana on Render.com
# Web service + PostgreSQL managed database
# ============================================================

databases:
  - name: cardio-ai-postgres
    plan: free               # Render free PostgreSQL (current supported plan)
    databaseName: cardioai_ghana
    user: cardioai

services:
  # HL7 v2 MLLP listener — raw TCP, so it runs as its own private service
  # (Render web services only expose HTTP). Devices/edge send HL7 here.
  - type: pserv
    name: cardio-ai-hl7-mllp
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: node server/hl7-service.js
    envVars:
      - key: HL7_MLLP_PORT
        value: "2575"
      - key: DATABASE_URL
        fromDatabase:
          name: cardio-ai-postgres
          property: connectionString
      # Provide HL7_TLS_KEY / HL7_TLS_CERT (PEM) to require MLLP-over-TLS in production
      - key: HL7_TLS_KEY
        sync: false
      - key: HL7_TLS_CERT
        sync: false

  - type: web
    name: cardio-ai-ghana
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: cardio-ai-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # ── Organisation email restriction (HIPAA access provisioning) ──
      # Comma-separated org domains allowed to self-provision via OAuth/registration.
      # Sub-domains are matched automatically (cardioai.gh → kbu.cardioai.gh).
      # cardioailive.com = corporate staff domain; cardioai.gh = platform/facility domain.
      - key: ALLOWED_EMAIL_DOMAINS
        value: cardioai.gh,cardioailive.com
      # Comma-separated individual emails allowed for testing (e.g. a Google
      # test account on gmail.com). Leave blank in production.
      - key: ALLOWED_EMAILS
        sync: false
      # Break-glass: set to an email that has already signed in (Google or
      # registration). On startup that account is elevated to an APPROVED
      # super_admin so there is always an administrator. Clear once real
      # admins are approved.
      - key: BOOTSTRAP_SUPER_ADMIN_EMAIL
        sync: false
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
    healthCheckPath: /api/health
